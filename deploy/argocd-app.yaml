apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: dn42-autopeer
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/redbean0721/dn42-autopeer.git
    targetRevision: deploy
    path: overlays/prod
  destination:
    name: osa-cluster
    namespace: dn42-autopeer
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
