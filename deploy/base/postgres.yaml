apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postgres
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:18.6-minimal-trixie
  enablePDB: false
  storage:
    size: 10Gi
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { memory: 1Gi }
  bootstrap:
    initdb:
      database: autopeer
      owner: autopeer
      localeProvider: builtin
      builtinLocale: C.UTF-8
  managed:
    roles:
      - name: registry_sync
        login: true
        passwordSecret:
          name: postgres-registry-sync
---
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: autopeer
spec:
  cluster:
    name: postgres
  name: autopeer
  owner: autopeer
  schemas:
    - name: registry
      owner: registry_sync
