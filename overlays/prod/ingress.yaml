apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: dn42-autopeer-public
  annotations:
    cert-manager.io/cluster-issuer: google-prod
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
    traefik.ingress.kubernetes.io/router.middlewares: dn42-autopeer-redirect-https@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - peer.dn42.redbean0721.com
      secretName: dn42-autopeer-public-tls
  rules:
    - host: peer.dn42.redbean0721.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  name: http
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  name: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: dn42-autopeer-dn42
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
    traefik.ingress.kubernetes.io/router.middlewares: dn42-autopeer-redirect-https@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - peer.redbean0721.dn42
      secretName: dn42-wildcard-tls
  rules:
    - host: peer.redbean0721.dn42
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  name: http
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  name: http
