name: build

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "frontend/**"
      - "registry-sync/**"
      - "deploy/**"
      - ".github/workflows/build.yml"
  pull_request:
    paths:
      - "backend/**"
      - "frontend/**"
      - "registry-sync/**"
      - ".github/workflows/build.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.event_name == 'pull_request' && github.ref || 'main' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE_PREFIX: ghcr.io/redbean0721/dn42-autopeer
  IS_PR: ${{ github.event_name == 'pull_request' }}
  COMPONENTS: '["backend", "frontend", "registry-sync"]'

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      components: ${{ steps.detect.outputs.components }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - id: detect
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ "$EVENT" = workflow_dispatch ] || ! git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
            result="$COMPONENTS"
          else
            changed="$(git diff --name-only "$BASE" HEAD)"
            if grep -qx '.github/workflows/build.yml' <<< "$changed"; then
              result="$COMPONENTS"
            else
              result="$(jq -c --arg changed "$changed" \
                'map(. as $c | select($changed | split("\n") | any(startswith($c + "/"))))' \
                <<< "$COMPONENTS")"
            fi
          fi
          echo "components=$result" | tee -a "$GITHUB_OUTPUT"

  image:
    needs: changes
    if: needs.changes.outputs.components != '[]'
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        component: ${{ fromJSON(needs.changes.outputs.components) }}
        platform: [linux/amd64, linux/arm64]
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
            arch: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch: arm64
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: build
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.component }}
          platforms: ${{ matrix.platform }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          outputs: type=image,name=${{ env.IMAGE_PREFIX }}-${{ matrix.component }},push-by-digest=true,name-canonical=true,push=${{ github.event_name != 'pull_request' }}
          cache-from: type=gha,scope=${{ matrix.component }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}-${{ matrix.arch }}

      - name: Export digest
        if: github.event_name != 'pull_request'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"

      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: digests-${{ matrix.component }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          retention-days: 1

  merge:
    needs: [changes, image]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        component: ${{ fromJSON(needs.changes.outputs.components) }}
    env:
      IMAGE: ghcr.io/redbean0721/dn42-autopeer-${{ matrix.component }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-${{ matrix.component }}-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create multi-arch manifest
        working-directory: ${{ runner.temp }}/digests
        run: |
          docker buildx imagetools create \
            -t "$IMAGE:$GITHUB_SHA" \
            -t "$IMAGE:main" \
            $(printf "$IMAGE@sha256:%s " *)

      - name: Inspect
        run: docker buildx imagetools inspect "$IMAGE:$GITHUB_SHA"

  deploy:
    needs: [changes, merge]
    if: >-
      always() && github.event_name != 'pull_request'
      && needs.changes.result == 'success'
      && (needs.merge.result == 'success' || needs.merge.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          path: src
      - uses: actions/checkout@v7
        with:
          ref: deploy
          path: out

      - name: Import GPG key
        uses: crazy-max/ghaction-import-gpg@v6
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}
          workdir: out
          git_user_signingkey: true
          git_commit_gpgsign: true
          git_committer_name: "Redbean0721 Deploy Bot"
          git_committer_email: "deploy@redbean0721.com"

      - name: Sync manifests and set image tags
        env:
          SHA: ${{ github.sha }}
          BUILT: ${{ needs.changes.outputs.components }}
          KUSTOMIZATION: out/overlays/prod/kustomization.yaml
        run: |
          get_tag() {
            [ -f "$KUSTOMIZATION" ] || return 0
            NAME="$1" yq '.images[] | select(.name == strenv(NAME)) | .newTag' "$KUSTOMIZATION"
          }

          declare -A previous
          for c in $(jq -r '.[]' <<< "$COMPONENTS"); do
            previous[$c]="$(get_tag "${IMAGE_PREFIX}-${c}")"
          done

          rsync -a --delete --exclude .git src/deploy/ out/

          for c in "${!previous[@]}"; do
            if jq -e --arg c "$c" 'index($c) != null' <<< "$BUILT" > /dev/null; then
              tag="$SHA"
            else
              tag="${previous[$c]}"
            fi
            [ -n "$tag" ] || continue
            echo "${c}: ${tag}"
            NAME="${IMAGE_PREFIX}-${c}" TAG="$tag" yq -i \
              '(.images[] | select(.name == strenv(NAME)) | .newTag) = strenv(TAG)' \
              "$KUSTOMIZATION"
          done

      - name: Validate
        run: kubectl kustomize out/overlays/prod > /dev/null

      - name: Commit and push
        working-directory: out
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          BUILT: ${{ needs.changes.outputs.components }}
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "deploy branch already up to date"
            exit 0
          fi
          COMMIT_SUBJECT="${COMMIT_MESSAGE%%$'\n'*}"
          COMMIT_SUBJECT="${COMMIT_SUBJECT:-manual run}"
          if [ "$BUILT" = "[]" ]; then
            DETAIL="Manifests only, images unchanged (${GITHUB_SHA})"
          else
            DETAIL="Update $(jq -r 'join(", ")' <<< "$BUILT") to ${GITHUB_SHA}"
          fi
          git commit -S -m "deploy: $COMMIT_SUBJECT" -m "$DETAIL"
          git pull --rebase origin deploy
          git push origin deploy
