apiVersion: apps/v1
kind: Deployment
metadata:
  name: registry-sync
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: registry-sync
  template:
    metadata:
      labels:
        app.kubernetes.io/name: registry-sync
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
        - name: registry-sync
          image: ghcr.io/redbean0721/dn42-autopeer-registry-sync
          ports:
            - name: http
              containerPort: 8080
          env:
            - { name: REGISTRY_WORKDIR, value: /data/registry }
            - { name: PGHOST, value: postgres-rw }
            - { name: PGDATABASE, value: autopeer }
            - { name: PGSSLMODE, value: require }
            - name: PGUSER
              valueFrom: { secretKeyRef: { name: postgres-registry-sync, key: username } }
            - name: PGPASSWORD
              valueFrom: { secretKeyRef: { name: postgres-registry-sync, key: password } }
          envFrom:
            - secretRef:
                name: registry-git
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 30
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 256Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: data, mountPath: /data }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - { name: data, emptyDir: { sizeLimit: 1Gi } }
        - { name: tmp, emptyDir: {} }
---
apiVersion: v1
kind: Service
metadata:
  name: registry-sync
spec:
  selector:
    app.kubernetes.io/name: registry-sync
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: registry-sync
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: registry-sync
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {}
      ports:
        - port: http
